<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="96" viewBox="0 0 1000 96" fill="none">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#020617"/><stop offset="1" stop-color="#0b1a3a"/>
</linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#6366f1"/>
</linearGradient>
<linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#38bdf8" stop-opacity=".55"/>
  <stop offset=".5" stop-color="#1e3a8a" stop-opacity=".35"/>
  <stop offset="1" stop-color="#6366f1" stop-opacity=".55"/>
</linearGradient>
<radialGradient id="glowA"><stop offset="0" stop-color="#38bdf8" stop-opacity=".35"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
<radialGradient id="glowB"><stop offset="0" stop-color="#6366f1" stop-opacity=".30"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
  <path d="M32 0H0V32" fill="none" stroke="#1e3a8a" stroke-opacity=".28" stroke-width="1"/>
</pattern>

<clipPath id="frame"><rect width="1000" height="96" rx="22"/></clipPath>
</defs>
<style>
text{font-family:'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif;}
.mono{font-family:'JetBrains Mono', 'Cascadia Code', Consolas, 'Courier New', monospace;}

</style>
<g clip-path="url(#frame)">
<rect width="1000" height="96" fill="url(#bg)"/>
<rect width="1000" height="96" fill="url(#grid)"/>
<text x="50" y="44" class="mono" font-size="13" fill="#38bdf8" letter-spacing="3">04</text>
<text x="88" y="44" font-size="13" fill="#94a3b8" letter-spacing="3" font-weight="600">СТАТИСТИКА</text>
<rect x="50" y="56" width="44" height="3" rx="1.5" fill="url(#accent)"/>
<text x="950" y="50" font-size="15" fill="#64748b" text-anchor="end">коммиты не отдыхают</text>
</g>
<rect x=".75" y=".75" width="998.5" height="94.5" rx="21.5" stroke="url(#stroke)" stroke-width="1.5"/>
</svg>
