<text x="30" y="112" fill="#8fb3d9" style="font-family:'Trebuchet MS',Verdana,sans-serif" font-size="14">Infinite TikTok accounts, each sealed in its own pocket dimension. Ctrl+1…9 to jump.</text><text x="30" y="133" fill="#8fb3d9" style="font-family:'Trebuchet MS',Verdana,sans-serif" font-size="14">Passwords stored: zero. Sessions mixed up: zero. Cookies leaking into the UI: zero, Morty.</text><text x="30" y="154" fill="#8fb3d9" style="font-family:'Trebuchet MS',Verdana,sans-serif" font-size="14">Glass UI, blurred chats for screen recording. Because I'm a scientist, not an animal.</text><line x1="30" x2="850" y1="180" y2="180" stroke="#1f4f86" stroke-width="2"/><text x="30" y="204" fill="#5ec8f5" style="font-family:Consolas,'Courier New',monospace" font-size="13">github / StackTok</text><text x="850" y="204" text-anchor="end" fill="#5ec8f5" style="font-family:'Trebuchet MS',Verdana,sans-serif" font-size="16">→</text></svg>
