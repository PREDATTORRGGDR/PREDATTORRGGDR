<svg xmlns="http://www.w3.org/2000/svg" width="490" height="250" viewBox="0 0 490 250" fill="none">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#020617"/><stop offset="1" stop-color="#0b1a3a"/>
</linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#6366f1"/>
</linearGradient>
<linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#38bdf8" stop-opacity=".55"/>
  <stop offset=".5" stop-color="#1e3a8a" stop-opacity=".35"/>
  <stop offset="1" stop-color="#6366f1" stop-opacity=".55"/>
</linearGradient>
<radialGradient id="glowA"><stop offset="0" stop-color="#38bdf8" stop-opacity=".35"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
<radialGradient id="glowB"><stop offset="0" stop-color="#6366f1" stop-opacity=".30"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
  <path d="M32 0H0V32" fill="none" stroke="#1e3a8a" stroke-opacity=".28" stroke-width="1"/>
</pattern>

<clipPath id="frame"><rect width="490" height="250" rx="22"/></clipPath>
</defs>
<style>
text{font-family:'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif;}
.mono{font-family:'JetBrains Mono', 'Cascadia Code', Consolas, 'Courier New', monospace;}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
.dot{animation:pulse 1.6s ease-in-out infinite}
.arrow{animation:slide 1.8s ease-in-out infinite}
.glow{animation:pulse 6s ease-in-out infinite}
</style>
<g clip-path="url(#frame)">
<rect width="490" height="250" fill="url(#bg)"/>
<rect width="490" height="250" fill="url(#grid)"/>

<circle class="glow" cx="470" cy="0" r="220" fill="url(#glowA)"/>
<rect x="32" y="28" width="60" height="60" rx="16" fill="#0f1f45" stroke="#1e3a8a"/>
<g transform="translate(62 58)"><path d="M-14 -22h-8v8M14 -22h8v8M-14 22h-8v-8M14 22h8v-8" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/><circle r="9" stroke="#38bdf8" stroke-width="3"/><path d="M-20 0h40" stroke="#38bdf8" stroke-opacity=".5" stroke-width="2"/></g>
<rect x="409" y="30" width="49" height="26" rx="13" fill="#052e2b" stroke="#14b8a6" stroke-opacity=".6"/>
<circle class="dot" cx="422" cy="43" r="4" fill="#2dd4bf"/>
<text x="439" y="48" font-size="12" fill="#99f6e4" text-anchor="middle" font-weight="600">live</text>
<text x="110" y="56" font-size="26" font-weight="800" fill="#f8fafc">GlowLab</text>
<rect x="110" y="66" width="102" height="22" rx="11" fill="#38bdf8" fill-opacity=".15" stroke="#38bdf8" stroke-opacity=".5"/>
<text x="161" y="81" font-size="12" fill="#38bdf8" text-anchor="middle" font-weight="600">Telegram-бот</text>
<text x="32" y="142" font-size="16" fill="#94a3b8">Разбирает лицо по 100+ геометрическим</text><text x="32" y="166" font-size="16" fill="#94a3b8">параметрам: гармония, пропорции,</text><text x="32" y="190" font-size="16" fill="#94a3b8">антропометрия — персонально по зонам.</text>
<path d="M32 206h426" stroke="#1e3a8a" stroke-opacity=".6"/>
<text x="32" y="232" class="mono" font-size="14" fill="#38bdf8">t.me/GlowLabRobot</text>
<g class="arrow"><text x="458" y="232" font-size="16" fill="#38bdf8" text-anchor="end">→</text></g>

</g>
<rect x=".75" y=".75" width="488.5" height="248.5" rx="21.5" stroke="url(#stroke)" stroke-width="1.5"/>
</svg>
