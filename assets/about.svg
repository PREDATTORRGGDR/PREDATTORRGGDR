<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" fill="none">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#020617"/><stop offset="1" stop-color="#0b1a3a"/>
</linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#6366f1"/>
</linearGradient>
<linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#38bdf8" stop-opacity=".55"/>
  <stop offset=".5" stop-color="#1e3a8a" stop-opacity=".35"/>
  <stop offset="1" stop-color="#6366f1" stop-opacity=".55"/>
</linearGradient>
<radialGradient id="glowA"><stop offset="0" stop-color="#38bdf8" stop-opacity=".35"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
<radialGradient id="glowB"><stop offset="0" stop-color="#6366f1" stop-opacity=".30"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
  <path d="M32 0H0V32" fill="none" stroke="#1e3a8a" stroke-opacity=".28" stroke-width="1"/>
</pattern>

<clipPath id="frame"><rect width="1000" height="400" rx="22"/></clipPath>
</defs>
<style>
text{font-family:'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif;}
.mono{font-family:'JetBrains Mono', 'Cascadia Code', Consolas, 'Courier New', monospace;}

@keyframes show{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.ln{opacity:0;animation:show .35s ease-out forwards}
.cursor{animation:blink 1s step-end infinite}

</style>
<g clip-path="url(#frame)">
<rect width="1000" height="400" fill="url(#bg)"/>
<rect width="1000" height="400" fill="url(#grid)"/>

<circle cx="980" cy="340" r="260" fill="url(#glowB)"/>
<text x="50" y="50" class="mono" font-size="13" fill="#38bdf8" letter-spacing="3">01</text>
<text x="88" y="50" font-size="13" fill="#94a3b8" letter-spacing="3" font-weight="600">КТО Я</text>
<rect x="50" y="62" width="44" height="3" rx="1.5" fill="url(#accent)"/>
<rect x="50" y="88" width="900" height="290" rx="14" fill="#030a1c" fill-opacity=".9" stroke="#1e3a8a"/>
<path d="M50 102a14 14 0 0 1 14-14h872a14 14 0 0 1 14 14v12H50z" fill="#0b1835"/>
<circle cx="74" cy="105" r="6" fill="#f87171"/><circle cx="94" cy="105" r="6" fill="#fbbf24"/><circle cx="114" cy="105" r="6" fill="#34d399"/>
<text x="500" y="110" class="mono" font-size="13" fill="#64748b" text-anchor="middle">kyrapyto@dev: ~</text>
<g class="ln" style="animation-delay:0.25s">
<text x="78" y="152" class="mono" font-size="16" fill="#6366f1">$</text>
<text x="104" y="152" class="mono" font-size="16" fill="#38bdf8">whoami</text></g><g class="ln" style="animation-delay:0.57s">
<text x="78" y="182" class="mono" font-size="16" fill="#475569">→</text>
<text x="104" y="182" class="mono" font-size="16" fill="#e2e8f0">indie-разработчик и фаундер из Украины</text></g><g class="ln" style="animation-delay:0.89s">
<text x="78" y="212" class="mono" font-size="16" fill="#6366f1">$</text>
<text x="104" y="212" class="mono" font-size="16" fill="#38bdf8">cat focus.txt</text></g><g class="ln" style="animation-delay:1.21s">
<text x="78" y="242" class="mono" font-size="16" fill="#475569">→</text>
<text x="104" y="242" class="mono" font-size="16" fill="#e2e8f0">AI-продукты · Telegram-боты · десктоп-софт на C# / C++</text></g><g class="ln" style="animation-delay:1.53s">
<text x="78" y="272" class="mono" font-size="16" fill="#6366f1">$</text>
<text x="104" y="272" class="mono" font-size="16" fill="#38bdf8">uptime</text></g><g class="ln" style="animation-delay:1.85s">
<text x="78" y="302" class="mono" font-size="16" fill="#475569">→</text>
<text x="104" y="302" class="mono" font-size="16" fill="#e2e8f0">сон — опционально, релизы — обязательно</text></g><g class="ln" style="animation-delay:2.17s">
<text x="78" y="332" class="mono" font-size="16" fill="#6366f1">$</text>
<text x="104" y="332" class="mono" font-size="16" fill="#38bdf8">echo $MOTTO</text></g><g class="ln" style="animation-delay:2.49s">
<text x="78" y="362" class="mono" font-size="16" fill="#475569">→</text>
<text x="104" y="362" class="mono" font-size="16" fill="#7dd3fc">«Меньше слов — больше релизов»</text></g>
<rect class="cursor" x="78" y="378" width="10" height="18" fill="#38bdf8"/>

</g>
<rect x=".75" y=".75" width="998.5" height="398.5" rx="21.5" stroke="url(#stroke)" stroke-width="1.5"/>
</svg>
