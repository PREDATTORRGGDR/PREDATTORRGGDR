<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" fill="none">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#020617"/><stop offset="1" stop-color="#0b1a3a"/>
</linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#6366f1"/>
</linearGradient>
<linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#38bdf8" stop-opacity=".55"/>
  <stop offset=".5" stop-color="#1e3a8a" stop-opacity=".35"/>
  <stop offset="1" stop-color="#6366f1" stop-opacity=".55"/>
</linearGradient>
<radialGradient id="glowA"><stop offset="0" stop-color="#38bdf8" stop-opacity=".35"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
<radialGradient id="glowB"><stop offset="0" stop-color="#6366f1" stop-opacity=".30"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
  <path d="M32 0H0V32" fill="none" stroke="#1e3a8a" stroke-opacity=".28" stroke-width="1"/>
</pattern>
<clipPath id="typeclip"><rect x="330" y="200" width="0" height="40"/></clipPath>
<linearGradient id="emb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f2a5f"/><stop offset="1" stop-color="#0a1531"/></linearGradient>
<clipPath id="frame"><rect width="1000" height="470" rx="22"/></clipPath>
</defs>
<style>
text{font-family:'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif;}
.mono{font-family:'JetBrains Mono', 'Cascadia Code', Consolas, 'Courier New', monospace;}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes type{from{width:0}to{width:560px}}
.ring{transform-origin:170px 170px;animation:spin 18s linear infinite}
.ring2{transform-origin:170px 170px;animation:spinr 26s linear infinite}
.glow{animation:pulse 5s ease-in-out infinite}
.dot{animation:pulse 1.6s ease-in-out infinite}
.cursor{animation:blink 1s step-end infinite}
.rise{opacity:0;animation:rise .8s ease-out forwards}
.stat{opacity:0;animation:rise .7s ease-out forwards}
#typeclip rect{animation:type 2.6s steps(40) .5s both}

</style>
<g clip-path="url(#frame)">
<rect width="1000" height="470" fill="url(#bg)"/>
<rect width="1000" height="470" fill="url(#grid)"/>

<circle class="glow" cx="170" cy="170" r="260" fill="url(#glowA)"/>
<circle class="glow" cx="900" cy="60" r="300" fill="url(#glowB)" style="animation-delay:2s"/>

<!-- emblem -->
<g>
  <circle cx="170" cy="170" r="104" fill="url(#emb)" stroke="#1e3a8a" stroke-width="2"/>
  <circle class="ring" cx="170" cy="170" r="122" stroke="url(#accent)" stroke-width="3" stroke-dasharray="70 22 8 22" stroke-linecap="round"/>
  <circle class="ring2" cx="170" cy="170" r="138" stroke="#38bdf8" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="2 10" stroke-linecap="round"/>
  <text x="170" y="198" font-size="86" font-weight="800" fill="url(#accent)" text-anchor="middle">K</text>
  <circle cx="246" cy="246" r="15" fill="#020617"/>
  <circle class="dot" cx="246" cy="246" r="9" fill="#22d3ee"/>
</g>

<!-- name -->
<g class="rise" style="animation-delay:.1s">
  <text x="330" y="96" class="mono" font-size="15" fill="#38bdf8" letter-spacing="2">// привет, я</text>
  <text x="326" y="170" font-size="74" font-weight="800" fill="#f8fafc" letter-spacing="-1.5">kyrapyto</text>
</g>

<!-- typing line -->
<g clip-path="url(#typeclip)">
  <text x="330" y="228" class="mono" font-size="21" fill="#cbd5e1">Строю AI-продукты. Сплю мало — шипаю много.</text>
</g>
<rect class="cursor" x="892" y="210" width="3" height="24" fill="#38bdf8" opacity="0"/>

<g class="rise" style="animation-delay:.35s"><rect x="330" y="268" width="98" height="32" rx="16" fill="#0f1f45" stroke="#1e3a8a"/>
<text x="379" y="289" font-size="14" fill="#cbd5e1" text-anchor="middle">Indie Dev</text><rect x="437.6" y="268" width="81" height="32" rx="16" fill="#0f1f45" stroke="#1e3a8a"/>
<text x="478" y="289" font-size="14" fill="#cbd5e1" text-anchor="middle">Founder</text><rect x="528.4000000000001" y="268" width="114" height="32" rx="16" fill="#0f1f45" stroke="#1e3a8a"/>
<text x="586" y="289" font-size="14" fill="#cbd5e1" text-anchor="middle">AI Products</text><rect x="652.8000000000001" y="268" width="131" height="32" rx="16" fill="#0f1f45" stroke="#1e3a8a"/>
<text x="718" y="289" font-size="14" fill="#cbd5e1" text-anchor="middle">Telegram Bots</text><rect x="794.0" y="268" width="81" height="32" rx="16" fill="#0f1f45" stroke="#1e3a8a"/>
<text x="834" y="289" font-size="14" fill="#cbd5e1" text-anchor="middle">Украина</text></g>

<!-- status pill -->
<g class="rise" style="animation-delay:.2s">
  <rect x="752" y="40" width="208" height="34" rx="17" fill="#052e2b" stroke="#14b8a6" stroke-opacity=".6"/>
  <circle class="dot" cx="774" cy="57" r="5" fill="#2dd4bf"/>
  <text x="788" y="62" font-size="14" fill="#99f6e4" font-weight="600">статус: очень занят</text>
</g>

<g class="stat" style="animation-delay:0.60s">
<rect x="60" y="350" width="205" height="82" rx="16" fill="#0a1531" fill-opacity=".85" stroke="#1e3a8a"/>
<text x="82" y="392" font-size="30" font-weight="800" fill="url(#accent)">4+</text>
<text x="82" y="417" font-size="14" fill="#94a3b8">продукта в работе</text>
</g><g class="stat" style="animation-delay:0.75s">
<rect x="285" y="350" width="205" height="82" rx="16" fill="#0a1531" fill-opacity=".85" stroke="#1e3a8a"/>
<text x="307" y="392" font-size="30" font-weight="800" fill="url(#accent)">800+</text>
<text x="307" y="417" font-size="14" fill="#94a3b8">контрибуций за год</text>
</g><g class="stat" style="animation-delay:0.90s">
<rect x="510" y="350" width="205" height="82" rx="16" fill="#0a1531" fill-opacity=".85" stroke="#1e3a8a"/>
<text x="532" y="392" font-size="30" font-weight="800" fill="url(#accent)">0</text>
<text x="532" y="417" font-size="14" fill="#94a3b8">выходных</text>
</g><g class="stat" style="animation-delay:1.05s">
<rect x="735" y="350" width="205" height="82" rx="16" fill="#0a1531" fill-opacity=".85" stroke="#1e3a8a"/>
<text x="757" y="392" font-size="30" font-weight="800" fill="url(#accent)">∞</text>
<text x="757" y="417" font-size="14" fill="#94a3b8">кофе</text>
</g>

</g>
<rect x=".75" y=".75" width="998.5" height="468.5" rx="21.5" stroke="url(#stroke)" stroke-width="1.5"/>
</svg>
